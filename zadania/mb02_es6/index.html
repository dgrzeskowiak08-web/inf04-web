<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista użytkowników</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="naglowek">
        <h1>Użytkownicy</h1>
        <p class="podtytul">Dane pobierane z zewnętrznego API</p>
    </header>

    <main>
        <section class="pole-filtra">
            <label for="filtr">Filtruj po nazwie:</label>
            <input type="text" id="filtr" placeholder="Wpisz imię lub nazwisko..." disabled>
            <p id="licznik" class="licznik"></p>
        </section>

        <section id="wynik">
            <p class="stan">Ładowanie danych...</p>
        </section>
    </main>

    <script src="api.js"></script>
</body>
</html>
